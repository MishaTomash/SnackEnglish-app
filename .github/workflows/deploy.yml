name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync repository to Hetzner Server
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "mkdir -p /app/snackenglish-app"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'dist' \
            --exclude 'backend/dist' \
            --exclude '.env' \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/app/snackenglish-app/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            cd /app/snackenglish-app

            # Генерація production .env із GitHub Secrets
            cat <<EOT > .env
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
            EOT

            docker compose pull || true
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
